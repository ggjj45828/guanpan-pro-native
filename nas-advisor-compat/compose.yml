name: guanpan-advisor

services:
  advisor:
    build: ./server
    ports:
      - "${GUANPAN_ADVISOR_PORT:-8789}:${GUANPAN_ADVISOR_PORT:-8789}"
    environment:
      GUANPAN_NEXT_DATA: /data
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GUANPAN_AI_PROFILE: ${GUANPAN_AI_PROFILE:-flash}
      GUANPAN_AI_BASE_URL: ${GUANPAN_AI_BASE_URL:-}
      GUANPAN_AI_MODEL: ${GUANPAN_AI_MODEL:-}
    volumes:
      - guanpan_advisor_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${GUANPAN_ADVISOR_PORT:-8789}/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
volumes:
  guanpan_advisor_data:
