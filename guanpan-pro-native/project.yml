name: GuanpanProNative
options:
  bundleIdPrefix: com.guanpan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  GuanpanProNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - Lab/LabCore.js
          - Lab/LabResearch.js
          - Lab/AssetChannel.js
      - path: Sources/Lab/LabCore.js
        buildPhase: resources
      - path: Sources/Lab/LabResearch.js
        buildPhase: resources
      - path: Sources/Lab/AssetChannel.js
        buildPhase: resources
    # 说明：XcodeGen 的 info 块语义是「按 properties 生成 plist 文件」。
    # 必须同时给出 path（否则报 Decoding failed at "path": Nothing found），
    # 也必须给出 properties（否则生成空白 plist，导致 UILaunchScreen / ATS /
    # 后台模式 / 显示名等关键配置静默丢失）。
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 观盘 Pro
        CFBundleName: 观盘 Pro
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "2.13.55"
        CFBundleVersion: "60"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        # 原来是空字典：启动瞬间是系统默认白/黑，会明显闪一下再进 App。
        # 指向 Assets 里的 LaunchBackground（浅色近白 / 深色近墨蓝），
        # 和图标同色系，冷启动看起来是连贯的。
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad 需要单独声明支持的方向，否则分栏布局在 iPad 上会被强制竖屏。
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        NSLocalNetworkUsageDescription: "连接你在设置中填写的 NAS 地址，用于同步观盘 Pro 本机账本和行情历史缓存。"
        # v2.12 起图片背景整组下线，设置页里已经没有相册入口（代码里也不再引用
        # PhotosPicker / UIImagePickerController），所以 NSPhotoLibrary* 两条一并删掉：
        # 留着等于向用户和审核声明一个用不到的权限。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.pro.native
        PRODUCT_MODULE_NAME: GuanpanProNative
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: 观盘 Pro
        GENERATE_INFOPLIST_FILE: "NO"
        # 1 = iPhone，2 = iPad。改成 "1,2" 后 App 才能在 iPad 上以全屏（而非放大 2 倍的兼容模式）运行，
        # 配合 ContentView 里 horizontalSizeClass == .regular 的分栏分支才真正有意义。
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    scheme:
      gatherCoverageData: false
  GuanpanProNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GuanpanProNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.pro.native.validation
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/观盘 Pro.app/观盘 Pro"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GuanpanProExperienceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GuanpanProNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.pro.native.experience
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: GuanpanProNative
schemes:
  GuanpanProValidation:
    build:
      targets:
        GuanpanProNative: all
        GuanpanProNativeTests: [test]
        GuanpanProExperienceTests: [test]
    test:
      config: Debug
      targets:
        - GuanpanProNativeTests
        - GuanpanProExperienceTests
      environmentVariables:
        GUANPAN_TESTING: "1"
  GuanpanProExperience:
    build:
      targets:
        GuanpanProNative: all
        GuanpanProExperienceTests: [test]
    test:
      config: Debug
      targets:
        - GuanpanProExperienceTests
