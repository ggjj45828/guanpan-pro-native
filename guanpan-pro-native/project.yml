name: GuanpanProNative
options:
  bundleIdPrefix: com.guanpan.pro.native
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  GuanpanProNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 观盘 Pro
        CFBundleName: GuanpanPro
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "2.13.56"
        CFBundleVersion: "61"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "连接你在设置中填写的 NAS 地址，用于研究数据和真实账本同步。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.pro.native
        PRODUCT_MODULE_NAME: GuanpanProNative
        PRODUCT_NAME: GuanpanPro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    scheme:
      gatherCoverageData: false
  GuanpanProExperienceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GuanpanProNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.pro.native.experience
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: GuanpanProNative
        CODE_SIGNING_ALLOWED: "NO"
schemes:
  GuanpanProNative:
    build:
      targets:
        GuanpanProNative: all
        GuanpanProExperienceTests: [test]
  GuanpanProValidation:
    build:
      targets:
        GuanpanProNative: all
        GuanpanProExperienceTests: [test]
    test:
      config: Debug
      targets:
        - GuanpanProExperienceTests
      environmentVariables:
        GUANPAN_TESTING: "1"
