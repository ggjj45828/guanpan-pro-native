name: GuanpanProNative
options:
  bundleIdPrefix: com.guanpan
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  GuanpanProNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # 说明：XcodeGen 的 info 块语义是「按 properties 生成 plist 文件」。
    # 必须同时给出 path（否则报 Decoding failed at "path": Nothing found），
    # 也必须给出 properties（否则生成空白 plist，导致 UILaunchScreen / ATS /
    # 后台模式 / 显示名等关键配置静默丢失）。
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 观盘 Pro
        CFBundleName: 观盘 Pro
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad 需要单独声明支持的方向，否则分栏布局在 iPad 上会被强制竖屏。
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        NSLocalNetworkUsageDescription: "连接你在设置中填写的 NAS 地址，用于同步观盘 Pro 本机账本和行情历史缓存。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guanpan.pro.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: 观盘 Pro
        GENERATE_INFOPLIST_FILE: "NO"
        # 1 = iPhone，2 = iPad。改成 "1,2" 后 App 才能在 iPad 上以全屏（而非放大 2 倍的兼容模式）运行，
        # 配合 ContentView 里 horizontalSizeClass == .regular 的分栏分支才真正有意义。
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    scheme:
      gatherCoverageData: false
