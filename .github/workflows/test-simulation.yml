name: Experimental simulation core
on:
  workflow_dispatch:
  push:
    branches: ['upgrade/v2.13.55-r2']
    paths:
      - 'Experimental/**'
      - '.github/workflows/test-simulation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test isolated simulation package
        working-directory: Experimental/SimulationCore
        run: swift test
