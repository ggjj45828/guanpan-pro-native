name: Validate isolated foundation
on:
  workflow_dispatch:
  push:
    paths:
      - 'nas-advisor-compat/**'
      - 'server/**'
      - 'nas-sync-server/**'
      - 'tests/**'
      - '.github/workflows/validate-foundation.yml'
permissions:
  contents: read
jobs:
  offline-core-and-channel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test NAS long-term research service
        run: python -m unittest discover -s nas-advisor-compat/tests -v
      - name: Test disabled legacy service and research API
        working-directory: server
        run: python -m unittest discover -s tests -v
      - name: Test NAS sync channels and market archive
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q nas-advisor-compat/server server nas-sync-server guanpan-pro-native/scripts
      - name: Validate NAS deployment manifests
        run: |
          docker compose -f compose.yml config -q
          docker compose -f nas-advisor-compat/compose.yml config -q
          docker compose -f nas-sync-server/docker-compose.yml config -q
          docker compose -f nas-sync-server/compose.yaml config -q

