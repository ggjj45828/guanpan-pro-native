name: Validate iOS candidate
on:
  workflow_dispatch:
  push:
    branches:
      - 'upgrade/v2.13.55-r2'
      - 'validation/**'
permissions:
  contents: read
jobs:
  simulator-validation:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GUANPAN_TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        working-directory: guanpan-pro-native
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Run portable Swift core tests
        run: |
          set -o pipefail
          swift test --package-path guanpan-pro-native 2>&1 | tee "$RUNNER_TEMP/swift-core-test.log"
      - name: Summarize portable Swift core failures
        if: always()
        run: |
          {
            echo '## Portable Swift core test diagnostics'
            echo
            if [ -f "$RUNNER_TEMP/swift-core-test.log" ]; then
              echo '```text'
              grep -E 'error:|failed|Failure|XCTAssert|Executed|Test Case|Test Suite|fatal error|warning:' "$RUNNER_TEMP/swift-core-test.log" | tail -n 160 || true
              echo '```'
            else
              echo 'No portable Swift log was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/portable-swift-core-summary.md"
          fi
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          devices=json.load(open(os.environ['RUNNER_TEMP']+'/devices.json'))['devices']
          candidates=[d for key,rows in devices.items() if 'iOS' in key for d in rows if d.get('isAvailable') and 'iPhone' in d['name']]
          if not candidates: raise SystemExit('No available iOS simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('SIMULATOR_ID='+candidates[0]['udid']+'\n')
          PY
      - name: Run application compile and Apple runtime tests
        run: |
          set -o pipefail
          xcodebuild test -project guanpan-pro-native/GuanpanProNative.xcodeproj \
            -scheme GuanpanProValidation -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/GuanpanValidation.xcresult" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log"
      - name: Summarize Apple validation failures
        if: always()
        run: |
          {
            echo '## Apple runtime validation diagnostics'
            echo
            if [ -f "$RUNNER_TEMP/xcodebuild-test.log" ]; then
              echo '### Compiler and test failure lines'
              echo '```text'
              grep -E 'error:|failed|FAIL|Executed|Testing failed|BUILD FAILED|TEST FAILED' "$RUNNER_TEMP/xcodebuild-test.log" | tail -n 120 || true
              echo '```'
              echo
            fi
            if [ -d "$RUNNER_TEMP/GuanpanValidation.xcresult" ]; then
              echo '### XCTest result summary'
              echo '```json'
              xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/GuanpanValidation.xcresult" --format json 2>/dev/null | head -c 12000 || true
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            cp "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/apple-validation-summary.md"
          fi
      - name: Export UI test screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/GuanpanValidation.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/GuanpanValidation.xcresult" --output-path "$RUNNER_TEMP/experience-screenshots" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-theme-screenshots
          path: ${{ runner.temp }}/experience-screenshots
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation-results
          path: |
            ${{ runner.temp }}/GuanpanValidation.xcresult
            ${{ runner.temp }}/experience-screenshots
            ${{ runner.temp }}/swift-core-test.log
            ${{ runner.temp }}/portable-swift-core-summary.md
            ${{ runner.temp }}/xcodebuild-test.log
            ${{ runner.temp }}/apple-validation-summary.md
          if-no-files-found: warn

