name: Guanpan Pro native iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/guanpan-pro-ios.yml'
      - 'Tools/**'
      - '.gitattributes'

permissions:
  contents: read

concurrency:
  group: guanpan-pro-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS app
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Static contracts and algorithm checks
        run: |
          python3 Tools/theme_contract.py
          python3 Tools/verify_algorithms.py
          python3 Tools/verify_symbols.py

      - name: Show Apple toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -list -project GuanpanProNative.xcodeproj

      - name: Build unsigned device app
        run: |
          set -o pipefail
          xcodebuild build \
            -project GuanpanProNative.xcodeproj \
            -scheme GuanpanProNative \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/Device \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-device.log

      - name: Package unsigned IPA
        run: |
          set -eu
          APP=$(find build/Device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "app: $APP"
          VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "version: $VER ($BUILD)"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 用 ditto 而不是 zip：ditto 会正确写 UTF-8 名称标志位并保留资源分叉。
          # 之前用 zip -qry 时条目名没有 UTF-8 标志，Windows 侧签名/安装工具
          # 按 ANSI 代码页解包会把路径解成乱码，表现就是「签名成功但装不上」。
          rm -f "GuanpanPro-${VER}-unsigned.ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "GuanpanPro-${VER}-unsigned.ipa"
          ls -lh "GuanpanPro-${VER}-unsigned.ipa"
          echo "IPA_NAME=GuanpanPro-${VER}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: guanpan-pro-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guanpan-pro-build-log
          path: build-device.log
          if-no-files-found: ignore
