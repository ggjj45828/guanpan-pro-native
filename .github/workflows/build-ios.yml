name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'upgrade/v2.13.55-r2'
      - 'validation/**'
      - 'b-latest'
    paths:
      - 'guanpan-pro-native/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

env:
  PROJECT_DIR: guanpan-pro-native
  SCHEME: GuanpanProNative

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project "$PROJECT_DIR/GuanpanProNative.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "Build succeeded but no app bundle was found." >&2
            find "$RUNNER_TEMP/DerivedData/Build/Products" -maxdepth 3 -type d -name '*.app' -print >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          # Keep ZIP entry names ASCII: some Windows re-signing tools fail to
          # decode a non-ASCII .app directory name produced by ditto.
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/GuanpanPro.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/GuanpanPro-unsigned.ipa"
          python3 "$GITHUB_WORKSPACE/$PROJECT_DIR/scripts/verify_ipa.py" "$RUNNER_TEMP/GuanpanPro-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: guanpan-pro-unsigned-ipa
          path: ${{ runner.temp }}/GuanpanPro-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
